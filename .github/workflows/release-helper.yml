name: Release Helper

# ローカル取得ヘルパー（Go 製ポータブルアプリ）の署名付きリリース（Issue #79）。
#
# 設計:
#   - Windows / macOS それぞれのランナーでビルドし、その場で署名する
#   - 署名・notarization に失敗したらジョブが落ち、publish へ進まない（公開しない）
#   - publish は署名済み artifact をダウンロードして checksum と provenance を作る。
#     再ビルドしないため、署名対象と公開対象が同一ファイルであることが保証される
#   - provenance は GitHub Artifact Attestations（SLSA）で、
#     `gh attestation verify <file> --repo <owner/repo>` で検証できる
#
# 実行方法:
#   git tag helper-v0.5.0 && git push origin helper-v0.5.0
#   （検証だけしたい場合は workflow_dispatch の dryRun を使う。公開はしない）
#
# 必要な secrets（未設定ならジョブは fail closed で停止する）:
#   HELPER_WINDOWS_PFX_BASE64 / HELPER_WINDOWS_PFX_PASSWORD
#   HELPER_MACOS_CERT_P12_BASE64 / HELPER_MACOS_CERT_PASSWORD
#   HELPER_MACOS_SIGN_IDENTITY
#   HELPER_MACOS_NOTARY_ISSUER_ID / HELPER_MACOS_NOTARY_KEY_ID / HELPER_MACOS_NOTARY_KEY_BASE64
#   鍵の管理・ローテーション・失効手順は docs/HELPER-RELEASE.md を参照。

on:
  push:
    tags: ["helper-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "リリースバージョン（例: 0.5.0）"
        required: true
      dryRun:
        description: "true なら署名まで行い、Release への公開はしない"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-helper-${{ github.ref }}
  cancel-in-progress: false

env:
  # 配布バイナリに埋め込む本番 SPA の origin（ヘルパーの Origin allowlist）。
  HELPER_ALLOWED_ORIGIN: https://config-manager.fly.dev

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#helper-v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "バージョンが Semantic Versioning ではありません: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: apps/helper/go.sum

      - name: Build
        working-directory: apps/helper
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $pkg = "github.com/Challenge-Consulting-Firm/config-manager/apps/helper/internal/server"
          $ldflags = "-s -w -X $pkg.Version=$env:VERSION -X $pkg.BuildTimeAllowedOrigin=$env:HELPER_ALLOWED_ORIGIN"
          New-Item -ItemType Directory -Force -Path ../../dist/windows-x64 | Out-Null
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags $ldflags -o ../../dist/windows-x64/config-manager-helper.exe ./cmd/helper

      - name: Sign (Authenticode)
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.HELPER_WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.HELPER_WINDOWS_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:PFX_BASE64)) {
            Write-Error "HELPER_WINDOWS_PFX_BASE64 が未設定です。未署名バイナリは公開しません。"
            exit 1
          }
          $pfx = Join-Path $env:RUNNER_TEMP "helper-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          try {
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName | Select-Object -Last 1
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 `
              dist\windows-x64\config-manager-helper.exe
            if ($LASTEXITCODE -ne 0) { throw "signtool sign が失敗しました" }
            & $signtool.FullName verify /pa dist\windows-x64\config-manager-helper.exe
            if ($LASTEXITCODE -ne 0) { throw "signtool verify が失敗しました" }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Verify signature status
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist\windows-x64\config-manager-helper.exe
          Write-Host "Status: $($sig.Status) / Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") {
            Write-Error "Authenticode 署名が Valid ではありません: $($sig.Status)"
            exit 1
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helper-windows-x64
          path: dist/windows-x64/config-manager-helper.exe
          if-no-files-found: error
          retention-days: 7

  build-macos:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: apps/helper/go.sum

      - name: Build universal binary
        working-directory: apps/helper
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          PKG="github.com/Challenge-Consulting-Firm/config-manager/apps/helper/internal/server"
          LDFLAGS="-s -w -X ${PKG}.Version=${VERSION} -X ${PKG}.BuildTimeAllowedOrigin=${HELPER_ALLOWED_ORIGIN}"
          mkdir -p ../../dist/darwin-universal
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o /tmp/helper-arm64 ./cmd/helper
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o /tmp/helper-amd64 ./cmd/helper
          lipo -create -output ../../dist/darwin-universal/config-manager-helper /tmp/helper-arm64 /tmp/helper-amd64
          rm -f /tmp/helper-arm64 /tmp/helper-amd64

      - name: Import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.HELPER_MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.HELPER_MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CERT_BASE64:-}" ]]; then
            echo "HELPER_MACOS_CERT_P12_BASE64 が未設定です。未署名バイナリは公開しません。" >&2
            exit 1
          fi
          # 一時キーチェーンを使い、ランナー既定のキーチェーンを汚さない。
          KEYCHAIN="$RUNNER_TEMP/helper-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign (Developer ID)
        env:
          SIGN_IDENTITY: ${{ secrets.HELPER_MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGN_IDENTITY:-}" ]]; then
            echo "HELPER_MACOS_SIGN_IDENTITY が未設定です。" >&2
            exit 1
          fi
          # hardened runtime（--options runtime）は notarization の必須条件。
          codesign --force --timestamp --options runtime \
            --sign "$SIGN_IDENTITY" dist/darwin-universal/config-manager-helper
          codesign --verify --strict --verbose=2 dist/darwin-universal/config-manager-helper

      - name: Notarize
        env:
          NOTARY_ISSUER_ID: ${{ secrets.HELPER_MACOS_NOTARY_ISSUER_ID }}
          NOTARY_KEY_ID: ${{ secrets.HELPER_MACOS_NOTARY_KEY_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.HELPER_MACOS_NOTARY_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${NOTARY_KEY_BASE64:-}" ]]; then
            echo "HELPER_MACOS_NOTARY_KEY_BASE64 が未設定です。notarization 無しでは公開しません。" >&2
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$KEY_FILE"
          # notarytool は単体バイナリを直接受け取れないため zip で提出する。
          ditto -c -k --keepParent dist/darwin-universal/config-manager-helper "$RUNNER_TEMP/helper.zip"
          set +e
          xcrun notarytool submit "$RUNNER_TEMP/helper.zip" \
            --issuer "$NOTARY_ISSUER_ID" --key-id "$NOTARY_KEY_ID" --key "$KEY_FILE" \
            --wait --timeout 30m
          status=$?
          set -e
          rm -f "$KEY_FILE" "$RUNNER_TEMP/helper.zip"
          if [[ $status -ne 0 ]]; then
            echo "notarization に失敗しました。公開を中止します。" >&2
            exit 1
          fi
          # 単体の Mach-O にはチケットを staple できない（.app/.dmg/.pkg のみ）。
          # Gatekeeper はオンラインで notarization を検証する。
          codesign --verify --strict --verbose=2 dist/darwin-universal/config-manager-helper

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helper-darwin-universal
          path: dist/darwin-universal/config-manager-helper
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Release の作成・アセットのアップロード
      id-token: write # provenance 署名（OIDC）
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # 署名済み artifact をそのまま取得する。ここで再ビルドしないことが、
      # 「署名対象 = 公開対象」を保証する唯一の担保。
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helper-windows-x64
          path: dist/windows-x64

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helper-darwin-universal
          path: dist/darwin-universal

      - name: Generate checksums and latest.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ./scripts/helper-release-manifest.sh \
            --dir dist \
            --version "$VERSION" \
            --base-url "https://github.com/$REPO/releases/download/helper-v$VERSION" \
            --windows-signature authenticode \
            --macos-signature developer-id-notarized
          cat dist/latest.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/windows-x64/config-manager-helper.exe
            dist/darwin-universal/config-manager-helper

      - name: Publish release
        if: ${{ github.event_name == 'push' || inputs.dryRun == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="helper-v$VERSION"
          # ファイル名が衝突しないよう、アップロード時に OS を含む名前へ変える。
          cp dist/windows-x64/config-manager-helper.exe "dist/config-manager-helper-windows-x64.exe"
          cp dist/darwin-universal/config-manager-helper "dist/config-manager-helper-darwin-universal"
          gh release create "$tag" --title "$tag" --notes "署名済みローカル取得ヘルパー $VERSION。検証手順は docs/HELPER-RELEASE.md を参照。" || true
          gh release upload "$tag" --clobber \
            "dist/config-manager-helper-windows-x64.exe" \
            "dist/config-manager-helper-darwin-universal" \
            dist/checksums.sha256 \
            dist/latest.json

      - name: Summary
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### ヘルパー $VERSION"
            echo
            echo '```'
            cat dist/checksums.sha256
            echo '```'
            echo
            echo "provenance の検証: \`gh attestation verify <file> --repo $REPO\`"
          } >> "$GITHUB_STEP_SUMMARY"
