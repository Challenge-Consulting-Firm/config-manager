name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Build
        run: pnpm build

      - name: Dependency audit (high+)
        # Surfaces advisories on every PR. Currently non-blocking because some
        # transitive highs (e.g. xlsx with no patched release) have no clean fix
        # yet — see docs/SECURITY.md. Flip continue-on-error to false once the
        # known exceptions are cleared or ignored via pnpm.auditConfig.
        run: pnpm audit --audit-level=high
        continue-on-error: true
