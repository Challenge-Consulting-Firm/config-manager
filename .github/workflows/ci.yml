name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Test
        run: pnpm -r run test

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Dependency audit (high+)
        # Known no-fix advisories are narrowly and temporarily allowlisted in
        # .github/security-audit-baseline.json. New highs and expired entries fail.
        run: pnpm audit:security

      - name: Test audit baseline gate
        run: pnpm test:audit-gate

      # ヘルパー配布 manifest（checksum / 署名種別）の生成を検証する。
      # 署名付きリリース（.github/workflows/release-helper.yml）が同じスクリプトを使う。
      - name: Test helper release manifest
        run: pnpm test:helper-manifest

  # ローカル取得ヘルパー（Go）のビルド・テスト。apps/helper のみを扱い、
  # pnpm workspace 外（package.json 無し）のため Node ジョブから独立させる。
  # Issue #43 最終コメントの確定設計に基づく。
  changes:
    runs-on: ubuntu-latest
    outputs:
      helper: ${{ steps.filter.outputs.helper }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # helper 関連ファイルの変更がない PR では後続の helper ジョブをスキップ。
          # push (main) では常に実行される（paths-filter は pull_request でのみ絞り込む）。
          filters: |
            helper:
              - "apps/helper/**"
              - "scripts/build-helper.sh"
              - "scripts/helper-release-manifest.sh"
              - ".github/workflows/ci.yml"

  helper:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.helper == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # golang.org/x/crypto（SSH 取得で使用）が go 1.25 以上を要求するため、
          # apps/helper/go.mod の go ディレクティブに合わせる。
          go-version: "1.25"
          cache-dependency-path: apps/helper/go.sum

      - name: Download dependencies
        working-directory: apps/helper
        run: go mod download

      - name: Build
        working-directory: apps/helper
        run: go build ./...

      - name: Vet
        working-directory: apps/helper
        run: go vet ./...

      - name: Test
        working-directory: apps/helper
        run: go test ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Check reachable vulnerabilities
        working-directory: apps/helper
        run: govulncheck ./...

      - name: Cross-build smoke (Windows / macOS)
        # クロスコンパイル可能かを軽く確認（成果物は保存しない）。
        working-directory: apps/helper
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/helper-win.exe ./cmd/helper
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64  go build -o /tmp/helper-mac-arm ./cmd/helper
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64  go build -o /tmp/helper-mac-amd ./cmd/helper

      - name: Build script smoke
        # scripts/build-helper.sh が最新の Go コードで成功するか確認
        # （成果物は BFF 配布ディレクトリへ生成される）。
        run: ./scripts/build-helper.sh 0.0.0-ci

  # Always reports a stable required-check context. The expensive helper job may
  # skip unrelated PRs, but any required helper run must finish successfully.
  helper-gate:
    needs: [changes, helper]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify helper result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          HELPER_RESULT: ${{ needs.helper.result }}
          HELPER_REQUIRED: ${{ github.event_name == 'push' || needs.changes.outputs.helper == 'true' }}
        run: |
          echo "changes=${CHANGES_RESULT} helper=${HELPER_RESULT} required=${HELPER_REQUIRED}"
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "changes job did not succeed" >&2
            exit 1
          fi
          if [[ "$HELPER_REQUIRED" == "true" ]]; then
            [[ "$HELPER_RESULT" == "success" ]] || {
              echo "required helper job did not succeed" >&2
              exit 1
            }
          else
            [[ "$HELPER_RESULT" == "skipped" ]] || {
              echo "unrequired helper job had an unexpected result" >&2
              exit 1
            }
          fi
