# Keep npm, Go, and GitHub Actions dependencies on a daily patch cadence.
# See docs/SECURITY.md for triage policy (when to bump / how to carve exceptions).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    # 型定義は実行環境の Node メジャーに合わせる（Dockerfile / CI = Node 24）。
    # メジャーを勝手に上げると型だけ先行し、実行環境に無い API を型チェックで
    # 検出できなくなるため、Node 本体を上げる際に手動で追従する。
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Group non-major bumps to cut PR noise; majors stay individual for review.
    groups:
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/apps/helper"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
